[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-oxidized"
version = "0.1.0"
description = "MCP server for the Oxidized network configuration backup tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-oxidized = "mcp_oxidized.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_oxidized"]
